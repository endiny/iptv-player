<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Encode the full path as a query param so index.html can restore it.
      // e.g. /player?foo=bar → /?/player?foo=bar
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') + '/?/' + l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash);
    </script>
  </head>
  <body></body>
</html>
